<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientia</title>
    
    <!-- 🍎 APP META TAGS TO HIDE SAFARI/CHROME TABS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scientia">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#09090b">

    <!-- Confetti & PDF Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h1>Scientia</h1>
        </div>
    </div>

    <!-- FULLSCREEN SLIDE MODAL -->
    <div id="slide-modal" class="hidden">
        <button id="close-modal-btn" aria-label="Close Slide">✕</button>
        <canvas id="pdf-render-canvas"></canvas>
    </div>

    <!-- SETTINGS MODAL (For API Key) -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h3>Settings</h3>
            <p>Enter your NVIDIA API Key for the AI Tutor. It is saved securely in your browser's local storage.</p>
            <input type="password" id="api-key-input" autocomplete="new-password" placeholder="nvapi-xxxxxxxxxxxx">
            <div class="settings-buttons">
                <button id="save-settings-btn" class="primary-btn 3d-btn">Save</button>
                <button id="close-settings-btn" class="option-btn 3d-btn">Close</button>
            </div>
        </div>
    </div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h1 id="main-title">Scientia</h1>
            </div>
            <div class="header-actions">
                <button id="settings-btn" aria-label="Settings">⚙️</button>
                <button id="theme-toggle" aria-label="Toggle Theme">☀️</button>
            </div>
        </header>

        <main id="setup-container" class="view-screen">
            <div class="spacer"></div>
            
            <div class="header-text text-center">
                <h2 id="subject-title">Ready to Study?</h2>
                <p class="subtitle" id="subject-subtitle">Load a question bank or generate a new one.</p>
            </div>
            
            <!-- MINIMALIST TOOLS MENU -->
            <div class="tools-menu">
                <label for="file-input" class="tool-btn" id="upload-label">
                    <span class="icon">📁</span> Load JSON File
                </label>
                <input type="file" id="file-input" accept=".json" class="hidden-input">

                <button id="generate-quiz-btn" class="tool-btn ai-btn">
                    <span class="icon">✨</span> Generate from PDF
                </button>
                <p id="ai-loading-text" class="hidden loading-text">Reading slides and thinking...</p>

                <button id="export-bank-btn" class="tool-btn hidden">
                    <span class="icon">💾</span> Save Bank to File
                </button>
            </div>

            <div class="spacer"></div>
            
            <!-- DUAL MODE BUTTONS -->
            <div id="start-actions" class="start-actions-container bottom-anchored hidden">
                <button id="start-10-btn" class="primary-btn 3d-btn">10 Questions</button>
                <button id="start-all-btn" class="option-btn 3d-btn">Practice All (<span id="all-count">0</span>)</button>
            </div>
        </main>

        <main id="quiz-container" class="view-screen hidden">
            <div class="progress-section">
                <div class="progress-bar-bg"><div id="progress-bar"></div></div>
                <div class="stats-row"><span id="progress-text">1 of 10</span><span id="streak-display" class="hidden">🔥 <span id="streak-count">0</span></span></div>
            </div>
            
            <div id="quiz-anim-wrapper">
                <h2 id="question-text" class="question-text">Loading...</h2>
                <div id="options-container" class="options-grid"></div>

                <div id="explanation-container" class="explanation-box hidden">
                    <div class="explainer-header">
                        <span>Explanation</span>
                        <div class="explainer-actions">
                            <button id="ai-tutor-btn" class="hidden">✨ AI Tutor</button>
                            <button id="view-slide-btn" class="hidden">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                Slide
                            </button>
                        </div>
                    </div>
                    <div class="explanation-scroll-area">
                        <p id="explanation-text"></p>
                        <div id="ai-explanation-box" class="hidden"></div>
                    </div>
                </div>
            </div>

            <!-- DUAL NAVIGATION BUTTONS -->
            <div id="nav-actions" class="start-actions-container bottom-anchored hidden">
                <button id="prev-btn" class="option-btn 3d-btn hidden">Back</button>
                <button id="next-btn" class="primary-btn 3d-btn hidden">Continue</button>
            </div>
        </main>

        <main id="result-container" class="view-screen hidden text-center">
            <div class="spacer"></div>
            <h2 id="result-message" class="result-title">Complete.</h2>
            <div class="score-display"><span id="score">0</span><span class="score-total" id="score-total-text">/10</span></div>
            <div class="spacer"></div>
            
            <div id="result-actions" class="start-actions-container bottom-anchored">
                <button id="restart-btn" class="primary-btn 3d-btn">Main Menu</button>
                <button id="retry-incorrect-btn" class="option-btn 3d-btn hidden">Retry Incorrect (<span id="incorrect-count">0</span>)</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
