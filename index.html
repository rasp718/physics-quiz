<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientia</title>
    <!-- Confetti & PDF Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* 🌑 DARK MODE */
        :root {
            --bg: #000000; --surface: #151516; --text-main: #FFFFFF; --text-muted: #8E8E93;
            --accent: #0A84FF; --accent-shadow: #0056B3; --border: #2C2C2E; --border-shadow: #121212;
            --correct-bg: #1B4D22; --correct-border: #32D74B; --correct-shadow: #1A7526; --correct-text: #4ADE80;
            --wrong-bg: #4A0F11; --wrong-border: #FF453A; --wrong-shadow: #8A1A1B; --wrong-text: #FF7B72;
        }

        /* ☀️ LIGHT MODE */
        [data-theme="light"] {
            --bg: #F7F3EE; --surface: #FFFFFF; --text-main: #1C1917; --text-muted: #78716C;
            --accent: #000000; --accent-shadow: #292524; --border: #E7E5E4; --border-shadow: #D6D3D1;
            --correct-bg: #F0FDF4; --correct-border: #22C55E; --correct-shadow: #16A34A; --correct-text: #166534;
            --wrong-bg: #FEF2F2; --wrong-border: #EF4444; --wrong-shadow: #DC2626; --wrong-text: #991B1B;
        }

        body, html {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background-color: var(--bg); color: var(--text-main);
            margin: 0; padding: 0; height: 100dvh; width: 100vw; 
            overflow: hidden; position: fixed; transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh; background-color: var(--bg); z-index: 9999;
            display: flex; justify-content: center; align-items: center; transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .splash-fade { opacity: 0; pointer-events: none; transform: scale(1.05); }
        .logo-container { display: flex; flex-direction: column; align-items: center; animation: gentlePulse 2s infinite ease-in-out; }
        .logo-container svg { width: 60px; height: 60px; color: var(--accent); margin-bottom: 10px; }
        .logo-container h1 { font-size: 28px; font-weight: 700; letter-spacing: -1px; margin: 0; color: var(--text-main); }
        @keyframes gentlePulse { 0% { transform: scale(0.98); opacity: 0.9; } 50% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(0.98); opacity: 0.9; } }

        /* App Layout */
        .app-wrapper { display: flex; flex-direction: column; width: 100%; max-width: 500px; margin: 0 auto; height: 100dvh; padding: 1rem 1rem 0 1rem; }
        .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.5rem; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 8px; }
        .header-logo { width: 22px; height: 22px; color: var(--text-main); }
        .app-header h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
        #theme-toggle { background: none; border: none; font-size: 20px; color: var(--text-main); cursor: pointer; padding: 4px; }
        .view-screen { display: flex; flex-direction: column; flex: 1; overflow: hidden; position: relative;}

        /* Text & Progress */
        .subtitle { color: var(--text-muted); font-size: 14px; margin-top: 2px; }
        .question-text { font-size: 18px; font-weight: 600; line-height: 1.3; margin: 0.25rem 0 0.75rem 0; flex-shrink: 0; }
        .text-center { text-align: center; }
        .spacer { flex: 1; }
        .progress-section { margin-bottom: 0.25rem; flex-shrink: 0; }
        .progress-bar-bg { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 4px;}
        #progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .stats-row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-muted); }
        #streak-display { color: #FF9F0A; font-weight: 800; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        /* Animations */
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .deal-anim { opacity: 0; animation: cardDeal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: calc(var(--i) * 0.08s); }
        @keyframes cardDeal { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in-right { animation: slideIn 0.3s ease-out forwards; }
        .slide-out-left { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-50%); opacity: 0; } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake { 10%, 90% { transform: translateX(-3px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
        .pulse-bounce { animation: pulseBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes pulseBounce { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        /* 3D Buttons & Options */
        .3d-btn { border: 2px solid var(--border); border-bottom: 5px solid var(--border-shadow); transform: translateY(0); transition: transform 0.1s, border-bottom-width 0.1s, background 0.2s, border-color 0.2s; }
        .3d-btn:active, .is-squished { transform: translateY(3px) !important; border-bottom-width: 2px !important; }
        .upload-btn { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--surface); color: var(--text-main); padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .hidden-input { display: none; }
        .options-grid { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
        .option-btn { background: var(--surface); color: var(--text-main); padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 500; text-align: left; line-height: 1.2; cursor: pointer; width: 100%; }
        .correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; border-bottom-color: var(--correct-shadow) !important; color: var(--correct-text) !important; }
        .wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; border-bottom-color: var(--wrong-shadow) !important; color: var(--wrong-text) !important; }
        .bottom-anchored { margin-top: auto; margin-bottom: 12px; flex-shrink: 0; }
        .primary-btn { background: var(--accent); border-color: var(--accent); border-bottom-color: var(--accent-shadow); color: #FFFFFF; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }

        /* Explanation Box */
        .explanation-box { margin-top: 8px; padding: 10px 12px; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; flex-shrink: 1; max-height: 24vh; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .explainer-header { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; flex-shrink: 0;}
        .explanation-scroll-area { overflow-y: auto; flex: 1; padding-right: 4px;}
        #explanation-text { margin: 0; font-size: 13px; line-height: 1.35; color: var(--text-main); font-weight: 500;}

        /* Secondary Button (View Slide) */
        .secondary-btn { background: transparent; border: 1.5px solid var(--accent); color: var(--accent); padding: 8px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 8px; display: flex; justify-content: center; gap: 6px; align-items: center;}
        
        /* PDF SLIDE MODAL */
        #slide-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
            background: rgba(0, 0, 0, 0.95); z-index: 10000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 1; transition: opacity 0.3s ease; padding: 20px;
        }
        #slide-modal.hidden { display: none !important; opacity: 0; pointer-events: none; }
        .modal-content { display: flex; flex-direction: column; width: 100%; align-items: center; }
        #close-modal-btn { align-self: flex-end; background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 16px; border-radius: 16px; font-weight: bold; margin-bottom: 12px; cursor: pointer; }
        
        /* PDF Canvas Style */
        #pdf-render-canvas {
            max-width: 100%; 
            max-height: 75vh; 
            border-radius: 8px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            background: white; /* Slides are usually white */
        }

        /* Results */
        .result-title { font-size: 28px; margin-bottom: 0; font-weight: 800; }
        .score-display { margin-top: 8px; }
        #score { font-size: 70px; font-weight: 800; letter-spacing: -3px; }
        .score-total { font-size: 26px; color: var(--text-muted); font-weight: 700; }
        .hidden { display: none !important; }
        
        @media (max-height: 740px) {
            .app-header h1 { font-size: 22px; }
            .question-text { font-size: 18px; margin-bottom: 12px; }
            .option-btn { padding: 12px 14px; font-size: 15px; }
            .primary-btn { padding: 14px; font-size: 16px; margin-bottom: 10px;}
            .explanation-box { padding: 12px; font-size: 14px; max-height: 130px;}
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h1>Scientia</h1>
        </div>
    </div>

    <!-- SLIDE MODAL -->
    <div id="slide-modal" class="hidden">
        <div class="modal-content">
            <button id="close-modal-btn">✖ Close</button>
            <canvas id="pdf-render-canvas"></canvas>
        </div>
    </div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h1 id="main-title">Scientia</h1>
            </div>
            <button id="theme-toggle" aria-label="Toggle Theme">☀️</button>
        </header>

        <main id="setup-container" class="view-screen">
            <div class="spacer"></div>
            <h2 id="subject-title">Select a Subject</h2>
            <p class="subtitle" id="subject-subtitle">Tap below to load your question bank.</p>
            <div class="upload-section">
                <label for="file-input" class="upload-btn 3d-btn" id="upload-label"><span class="icon">📁</span> Choose JSON File</label>
                <input type="file" id="file-input" accept=".json" class="hidden-input">
            </div>
            <div class="spacer"></div>
            <button id="start-btn" class="primary-btn 3d-btn bottom-anchored hidden">Start Quiz</button>
        </main>

        <main id="quiz-container" class="view-screen hidden">
            <div class="progress-section">
                <div class="progress-bar-bg"><div id="progress-bar"></div></div>
                <div class="stats-row"><span id="progress-text">1 of 10</span><span id="streak-display" class="hidden">🔥 <span id="streak-count">0</span></span></div>
            </div>
            
            <div id="quiz-anim-wrapper">
                <h2 id="question-text" class="question-text">Loading...</h2>
                <div id="options-container" class="options-grid"></div>

                <div id="explanation-container" class="explanation-box hidden">
                    <div class="explainer-header">Explanation</div>
                    <div class="explanation-scroll-area">
                        <p id="explanation-text"></p>
                        <button id="view-slide-btn" class="secondary-btn hidden">🖼️ View Source Slide</button>
                    </div>
                </div>
            </div>

            <button id="next-btn" class="primary-btn 3d-btn bottom-anchored hidden">Continue</button>
        </main>

        <main id="result-container" class="view-screen hidden text-center">
            <div class="spacer"></div>
            <h2 id="result-message" class="result-title">Complete.</h2>
            <div class="score-display"><span id="score">0</span><span class="score-total">/10</span></div>
            <div class="spacer"></div>
            <button id="restart-btn" class="primary-btn 3d-btn bottom-anchored">Done</button>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
