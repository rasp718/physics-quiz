<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientia</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1 id="main-title">Scientia</h1>
            <button id="theme-toggle" aria-label="Toggle Theme">☀️</button>
        </header>

        <!-- Setup Screen -->
        <main id="setup-container" class="view-screen">
            <div class="spacer"></div>
            <h2 id="subject-title">Select a Subject</h2>
            <p class="subtitle" id="subject-subtitle">Tap below to load your question bank.</p>
            
            <div class="upload-section">
                <label for="file-input" class="upload-btn" id="upload-label">
                    <span class="icon">📁</span> Choose JSON File
                </label>
                <input type="file" id="file-input" accept=".json" class="hidden-input">
            </div>
            
            <div class="spacer"></div>
            <button id="start-btn" class="primary-btn bottom-anchored hidden">Start Quiz</button>
        </main>

        <!-- Quiz Screen -->
        <main id="quiz-container" class="view-screen hidden">
            <div class="progress-section">
                <div class="progress-bar-bg"><div id="progress-bar"></div></div>
                <div class="stats-row">
                    <span id="progress-text">1 of 10</span>
                    <span id="streak-display" class="hidden">🔥 <span id="streak-count">0</span></span>
                </div>
            </div>
            
            <h2 id="question-text" class="question-text">Loading...</h2>
            
            <div id="options-container" class="options-grid"></div>

            <div id="explanation-container" class="explanation-box hidden">
                <div class="explainer-header">Explanation</div>
                <p id="explanation-text"></p>
                <img id="explanation-image" src="" alt="Diagram" class="hidden">
            </div>

            <button id="next-btn" class="primary-btn bottom-anchored hidden">Continue</button>
            <!-- Spacer so the bottom button doesn't cover content -->
            <div class="bottom-padding"></div>
        </main>

        <!-- Results Screen -->
        <main id="result-container" class="view-screen hidden text-center">
            <div class="spacer"></div>
            <h2 id="result-message" class="result-title">Complete.</h2>
            <div class="score-display">
                <span id="score">0</span><span class="score-total">/10</span>
            </div>
            <div class="spacer"></div>
            <button id="restart-btn" class="primary-btn bottom-anchored">Done</button>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
