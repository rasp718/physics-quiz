<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientia</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scientia">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>

    <!-- FULLSCREEN SLIDE MODAL -->
    <div id="slide-modal" class="hidden">
        <button id="close-modal-btn" aria-label="Close Slide">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </button>
        <canvas id="pdf-render-canvas"></canvas>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h3>Settings</h3>
            <p class="text-secondary">Enter your NVIDIA API Key for the AI Tutor and Generator.</p>
            <input type="password" id="api-key-input" autocomplete="new-password" placeholder="nvapi-xxxxxxxxxxxx">
            <div class="settings-buttons">
                <button id="close-settings-btn" class="btn secondary-btn">Cancel</button>
                <button id="save-settings-btn" class="btn primary-btn">Save</button>
            </div>
        </div>
    </div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h1 id="main-title">Scientia</h1>
            </div>
            <div class="header-actions">
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <!-- SETUP SCREEN -->
        <main id="setup-container" class="view-screen">
            <div class="setup-hero">
                <h2 id="subject-title">Knowledge Base</h2>
                <p id="subject-subtitle" class="text-secondary">0 questions loaded.</p>
            </div>

            <div class="setup-grid">
                <!-- Import JSON -->
                <label for="file-input" class="setup-card" id="upload-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <div class="setup-card-info">
                        <h3>Import Bank</h3>
                        <p id="upload-desc">Load a .json file</p>
                    </div>
                </label>
                <input type="file" id="file-input" accept=".json" class="hidden">

                <!-- Generate AI -->
                <button id="generate-quiz-btn" class="setup-card">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                    <div class="setup-card-info">
                        <h3 id="generate-title">Generate from PDF</h3>
                        <p id="generate-desc">Extract using AI</p>
                    </div>
                </button>

                <!-- Export (Hidden until loaded) -->
                <button id="export-bank-btn" class="setup-card hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    <div class="setup-card-info">
                        <h3>Save Bank</h3>
                        <p>Export current questions</p>
                    </div>
                </button>
            </div>
            
            <p id="ai-loading-text" class="hidden text-secondary text-center" style="margin-top: 1rem; font-size: 13px;">Analyzing document...</p>

            <!-- Bottom Actions -->
            <div id="start-actions" class="start-actions hidden bottom-anchored">
                <button id="start-10-btn" class="btn primary-btn">10 Questions</button>
                <button id="start-all-btn" class="btn secondary-btn">Practice All (<span id="all-count">0</span>)</button>
            </div>
        </main>

        <!-- QUIZ SCREEN -->
        <main id="quiz-container" class="view-screen hidden">
            <div class="progress-section">
                <div class="progress-bar-bg"><div id="progress-bar"></div></div>
                <div class="stats-row">
                    <span id="progress-text" class="text-secondary">1 of 10</span>
                    <span id="streak-display" class="hidden text-secondary">
                        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" stroke="none" style="vertical-align: middle; margin-right: 2px;"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> <span id="streak-count">0</span>
                    </span>
                </div>
            </div>
            
            <div id="quiz-anim-wrapper">
                <h2 id="question-text" class="question-text">Loading...</h2>
                <div id="options-container" class="options-grid"></div>

                <div id="explanation-container" class="explanation-box hidden">
                    <div class="explainer-header">
                        <span>Explanation</span>
                        <div class="explainer-actions">
                            <button id="ai-tutor-btn" class="action-badge hidden">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg> Tutor
                            </button>
                            <button id="view-slide-btn" class="action-badge hidden">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg> Slide
                            </button>
                        </div>
                    </div>
                    <div class="explanation-scroll-area">
                        <p id="explanation-text"></p>
                        <div id="ai-explanation-box" class="hidden"></div>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div id="nav-actions" class="start-actions bottom-anchored hidden">
                <button id="prev-btn" class="btn secondary-btn hidden">Back</button>
                <button id="next-btn" class="btn primary-btn hidden" style="grid-column: span 2;">Continue</button>
            </div>
        </main>

        <!-- RESULTS SCREEN -->
        <main id="result-container" class="view-screen hidden text-center">
            <div class="spacer"></div>
            <h2 id="result-message" class="result-title">Session Complete</h2>
            <div class="score-display"><span id="score">0</span><span class="score-total" id="score-total-text">/10</span></div>
            <div class="spacer"></div>
            
            <div id="result-actions" class="start-actions bottom-anchored">
                <button id="restart-btn" class="btn primary-btn" style="grid-column: span 2;">Main Menu</button>
                <button id="retry-incorrect-btn" class="btn secondary-btn hidden" style="grid-column: span 2;">Retry Incorrect (<span id="incorrect-count">0</span>)</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
