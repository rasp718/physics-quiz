<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MedImage Physics Pro</title>
    <!-- Loads the Confetti Cannon -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="container">
        <header>
            <h1>PHYS 2603</h1>
            <p>Medical Imaging Principles</p>
        </header>
        
        <!-- Setup -->
        <div id="setup-container" class="card glass">
            <h2 style="margin-bottom:0.5rem">Practice Quiz</h2>
            <p style="font-size:0.9rem; margin-bottom:1rem; opacity:0.8;">Master Ultrasound, X-Ray, and MRI.</p>
            <div class="upload-section">
                <input type="file" id="file-input" accept=".json" style="font-size:0.7rem; color: #fff;">
            </div>
            <button id="start-btn" class="primary-btn glow">Start Mission</button>
        </div>

        <!-- Quiz -->
        <div id="quiz-container" class="card glass hidden">
            <div class="quiz-header">
                <div class="progress-bar-container"><div id="progress-bar"></div></div>
                <div class="stats-row">
                    <span id="progress-text">Q1 / 10</span>
                    <span id="streak-display" class="hidden">🔥 Streak: <span id="streak-count">0</span></span>
                </div>
            </div>
            
            <h2 id="question-text">Question Loading...</h2>
            <div id="options-container"></div>

            <div id="explanation-container" class="explanation-box hidden">
                <div class="explainer-header">Scan Analysis:</div>
                <p id="explanation-text"></p>
            </div>

            <button id="next-btn" class="primary-btn hidden">Next Scan →</button>
        </div>

        <!-- Results -->
        <div id="result-container" class="card glass hidden">
            <div id="result-emoji" class="result-icon">🎯</div>
            <h2 id="result-message">Mission Complete!</h2>
            <div class="score-display"><span id="score">0</span><small>/10</small></div>
            <button id="restart-btn" class="primary-btn glow">Run Another Scan</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
