<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scientia</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scientia">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <h1>Scientia</h1>
        </div>
    </div>

    <!-- FULLSCREEN SLIDE MODAL -->
    <div id="slide-modal" class="hidden">
        <button id="close-modal-btn" aria-label="Close Slide">✕</button>
        <canvas id="pdf-render-canvas"></canvas>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="hidden">
        <div class="settings-content">
            <h3>Settings</h3>
            <p>Enter your NVIDIA API Key for the AI Tutor and Generator.</p>
            <input type="password" id="api-key-input" autocomplete="new-password" placeholder="nvapi-xxxxxxxxxxxx">
            <div class="settings-buttons">
                <button id="save-settings-btn" class="premium-btn primary">Save</button>
                <button id="close-settings-btn" class="premium-btn secondary">Close</button>
            </div>
        </div>
    </div>

    <div class="app-wrapper">
        <header class="app-header">
            <div class="brand">
                <svg class="header-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                <h1 id="main-title">Scientia</h1>
            </div>
            <div class="header-actions">
                <button id="settings-btn" class="icon-btn" aria-label="Settings">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </button>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <!-- SETUP SCREEN -->
        <main id="setup-container" class="view-screen setup-screen">
            <div class="setup-content-wrapper">
                <div class="hero-header">
                    <h2 id="subject-title">Knowledge Base</h2>
                    <p id="subject-subtitle" class="text-muted">0 questions loaded.</p>
                </div>

                <!-- Sleek Menu Group -->
                <div class="menu-group">
                    <label for="file-input" class="menu-item" id="upload-label">
                        <div class="menu-icon">📁</div>
                        <div class="menu-text">
                            <span class="menu-title">Load Question Bank</span>
                            <span class="menu-desc" id="upload-desc">Import a JSON file</span>
                        </div>
                    </label>
                    <input type="file" id="file-input" accept=".json" class="hidden-input">

                    <button id="generate-quiz-btn" class="menu-item">
                        <div class="menu-icon highlight">✨</div>
                        <div class="menu-text">
                            <span class="menu-title" id="generate-title">Generate from PDF</span>
                            <span class="menu-desc" id="generate-desc">Extract 10 new questions using AI</span>
                        </div>
                    </button>

                    <button id="export-bank-btn" class="menu-item hidden">
                        <div class="menu-icon success">💾</div>
                        <div class="menu-text">
                            <span class="menu-title">Save Bank to File</span>
                            <span class="menu-desc">Export current loaded questions</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Bottom Actions -->
            <div id="start-actions" class="start-actions-wrapper hidden">
                <h3 class="section-label">Start Session</h3>
                <div class="start-grid">
                    <button id="start-10-btn" class="premium-btn primary">10 Questions</button>
                    <button id="start-all-btn" class="premium-btn secondary">Practice All (<span id="all-count">0</span>)</button>
                </div>
            </div>
        </main>

        <!-- QUIZ SCREEN -->
        <main id="quiz-container" class="view-screen hidden">
            <div class="progress-section">
                <div class="progress-bar-bg"><div id="progress-bar"></div></div>
                <div class="stats-row"><span id="progress-text">1 of 10</span><span id="streak-display" class="hidden">🔥 <span id="streak-count">0</span></span></div>
            </div>
            
            <div id="quiz-anim-wrapper">
                <h2 id="question-text" class="question-text">Loading...</h2>
                <div id="options-container" class="options-grid"></div>

                <div id="explanation-container" class="explanation-box hidden">
                    <div class="explainer-header">
                        <span>Explanation</span>
                        <div class="explainer-actions">
                            <button id="ai-tutor-btn" class="action-badge tutor hidden">✨ AI Tutor</button>
                            <button id="view-slide-btn" class="action-badge slide hidden">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg> Slide
                            </button>
                        </div>
                    </div>
                    <div class="explanation-scroll-area">
                        <p id="explanation-text"></p>
                        <div id="ai-explanation-box" class="hidden"></div>
                    </div>
                </div>
            </div>

            <div id="nav-actions" class="start-grid bottom-anchored hidden">
                <button id="prev-btn" class="premium-btn secondary hidden">Back</button>
                <button id="next-btn" class="premium-btn primary hidden" style="grid-column: span 2;">Continue</button>
            </div>
        </main>

        <!-- RESULTS SCREEN -->
        <main id="result-container" class="view-screen hidden text-center">
            <div class="spacer"></div>
            <h2 id="result-message" class="result-title">Complete.</h2>
            <div class="score-display"><span id="score">0</span><span class="score-total" id="score-total-text">/10</span></div>
            <div class="spacer"></div>
            
            <div id="result-actions" class="start-grid bottom-anchored">
                <button id="restart-btn" class="premium-btn primary" style="grid-column: span 2;">Main Menu</button>
                <button id="retry-incorrect-btn" class="premium-btn secondary hidden" style="grid-column: span 2;">Retry Incorrect (<span id="incorrect-count">0</span>)</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
